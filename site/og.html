<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<title>omixor — social preview source (1200×630)</title>
<style>
  /* 社群預覽圖(og.png)的來源:瀏覽器開成 1200×630 截圖後存成 og.png(實際尺寸看瀏覽器窗格,目前 800×420,比例同 1200×630)。改了文案或配色要重截。 */
  html, body { margin: 0; width: 1200px; height: 630px; background: #05070a; overflow: hidden; }
  body { position: relative; font-family: "Space Grotesk", "Inter", system-ui, sans-serif; color: #e6edf3; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(148,163,184,.12) 1px, transparent 1px), linear-gradient(90deg, rgba(148,163,184,.12) 1px, transparent 1px); background-size: 56px 56px; mask-image: radial-gradient(ellipse 90% 80% at 30% 20%, #000 20%, transparent 75%); }
  .glow { position: absolute; inset: 0; background: radial-gradient(40% 55% at 20% 25%, rgba(142,125,255,.28), transparent 70%), radial-gradient(35% 50% at 85% 80%, rgba(110,242,192,.2), transparent 70%); }
  .wrap { position: absolute; inset: 0; padding: 72px 80px; display: flex; flex-direction: column; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 34px; letter-spacing: -0.02em; }
  h1 { margin: 0; font-size: 84px; line-height: 1.02; letter-spacing: -0.04em; max-width: 960px; padding-bottom: .1em; background: linear-gradient(100deg, #fff 0%, #cfe9ff 30%, #6ef2c0 60%, #8e7dff 90%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: 22px; font-size: 28px; color: #8b98a9; max-width: 820px; line-height: 1.35; font-family: "Inter", system-ui, sans-serif; }
  .foot { display: flex; align-items: center; gap: 12px; font-family: ui-monospace, "JetBrains Mono", Consolas, monospace; font-size: 22px; color: #6ef2c0; }
  .foot span { color: #5b6676; }
  .agents { position: absolute; right: 80px; top: 72px; display: flex; gap: 14px; }
  .agent { width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; font: 600 22px ui-monospace, Consolas, monospace; background: rgba(5,7,10,.9); border: 2px solid var(--c); color: var(--c); box-shadow: 0 0 24px color-mix(in srgb, var(--c) 40%, transparent); }
</style>
</head>
<body>
  <div class="grid"></div><div class="glow"></div>
  <div class="agents">
    <div class="agent" style="--c:#8e7dff">W</div><div class="agent" style="--c:#4cc3ff">R</div><div class="agent" style="--c:#6ef2c0">D</div><div class="agent" style="--c:#ffb547">O</div><div class="agent" style="--c:#ff6b8a">A</div>
  </div>
  <div class="wrap">
    <div class="logo">
      <svg width="40" height="40" viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="13" stroke="#8e7dff" stroke-width="2.2"/><circle cx="16" cy="16" r="4.2" fill="#6ef2c0"/><circle cx="16" cy="3" r="2.2" fill="#8e7dff"/><circle cx="27.3" cy="22.5" r="2.2" fill="#4cc3ff"/><circle cx="4.7" cy="22.5" r="2.2" fill="#ffb547"/></svg>
      omixor
    </div>
    <div>
      <h1>Your team, plus a crew of AI agents</h1>
      <div class="sub">Agents claim tasks, read your docs, talk in your channels and report back. People keep the final say.</div>
    </div>
    <div class="foot">$ claude mcp add --transport http omixor <span>https://omixor.io/mcp/org/&lt;your-org&gt;</span></div>
  </div>
</body>
</html>
