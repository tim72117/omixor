<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>待決定畫面</title>
<style>
/* COMMON-CSS-BEGIN */
:root{--bg:var(--color-background-primary,#fff);--fg:var(--color-text-primary,#1f2328);--fg2:var(--color-text-secondary,#656d76);--bd:var(--color-border-primary,#d0d7de);--bg2:var(--color-background-secondary,#f6f8fa);--font:var(--font-sans,system-ui,-apple-system,"Noto Sans TC",sans-serif);--fs:var(--font-text-md-size,14px);--fss:var(--font-text-sm-size,12px);--r:var(--border-radius-md,8px);color-scheme:light dark}
:root[data-theme=dark]{--bg:var(--color-background-primary,#1c1c1e);--fg:var(--color-text-primary,#f0f0f0);--fg2:var(--color-text-secondary,#a0a0a8);--bd:var(--color-border-primary,#3a3a3e);--bg2:var(--color-background-secondary,#2a2a2e)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:var(--color-background-primary,#1c1c1e);--fg:var(--color-text-primary,#f0f0f0);--fg2:var(--color-text-secondary,#a0a0a8);--bd:var(--color-border-primary,#3a3a3e);--bg2:var(--color-background-secondary,#2a2a2e)}}
html,body{margin:0;background:transparent;color:var(--fg);font:var(--fs)/1.45 var(--font)}
#root{padding:10px 12px;box-sizing:border-box}
.title,.head{font-weight:600;margin-bottom:8px}
.svg svg{display:block;margin:0 auto;max-width:100%;height:auto;color:var(--fg)}
.row{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--bd)}
.main{flex:1;min-width:0}.t{word-break:break-word}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:3px;font-size:var(--fss);color:var(--fg2)}
.chip{padding:1px 8px;border-radius:999px;border:1px solid var(--bd);font-size:var(--fss);color:var(--fg)}
.s-done{background:rgba(46,160,67,.18)}.s-doing{background:rgba(56,139,253,.18)}.s-blocked{background:rgba(248,81,73,.18)}.s-todo,.s-canceled{background:var(--bg2)}
.warn{margin-top:8px;font-size:var(--fss);color:var(--fg2)}.err{color:#f85149}
/* COMMON-CSS-END */
.sec{font-weight:600;margin:12px 0 2px}.sec:first-of-type{margin-top:0}
.s-open{background:rgba(210,153,34,.2)}.s-decided{background:rgba(46,160,67,.18)}.s-withdrawn{background:var(--bg2)}
.txt{white-space:pre-wrap;word-break:break-word}.clip{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.opts{margin:4px 0 0;padding-left:20px;font-size:var(--fss)}.opts .rec{font-weight:600}.opts .d{color:var(--fg2)}
.ans{margin-top:4px;font-size:var(--fss)}.ans b{font-weight:600}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}.bar .head{margin-bottom:8px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.act{font:inherit;font-size:var(--fss);color:var(--fg);background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:3px 10px;cursor:pointer}
.act:disabled{opacity:.5;cursor:default}.act.rec{font-weight:600}
.confirm{margin-top:6px;padding:8px;border:1px solid var(--bd);border-radius:var(--r);font-size:var(--fss)}
.confirm textarea{display:block;width:100%;box-sizing:border-box;margin:6px 0;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:4px 6px}
.btn{background:none;border:0;padding:0;font:inherit;font-size:var(--fss);color:var(--fg2);text-decoration:underline;cursor:pointer}
</style></head>
<body><div id="root">載入中…</div>
<script>
(function () {
"use strict";
/* COMMON-JS-BEGIN */
// ---- 共用:MCP Apps 的 View 端(postMessage 上的 JSON-RPC)。不依賴任何外部程式庫。共用區塊只負責收結果與握手,不呼叫工具;需要呼叫工具的畫面(decisions)自己用 request() 發工具呼叫請求 ----
var root = document.getElementById("root");
var pending = {}, nextId = 1, onResult = function () {};
var toolArgs = null, hostCaps = {}, hostInfo = null; // toolArgs:觸發這個畫面的工具呼叫的參數(ui/notifications/tool-input);hostCaps、hostInfo:宿主在 ui/initialize 回報的能力與名稱版本
function post(m) { m.jsonrpc = "2.0"; window.parent.postMessage(m, "*"); }
function request(method, params) {
  return new Promise(function (resolve, reject) {
    var id = nextId++;
    pending[id] = { resolve: resolve, reject: reject };
    post({ id: id, method: method, params: params });
  });
}
function notify(method, params) { post({ method: method, params: params }); }
function applyCtx(ctx) {
  if (!ctx) return;
  var el = document.documentElement;
  if (ctx.theme === "light" || ctx.theme === "dark") { el.setAttribute("data-theme", ctx.theme); el.style.colorScheme = ctx.theme; }
  var v = ctx.styles && ctx.styles.variables;
  if (v) Object.keys(v).forEach(function (k) { if (k.indexOf("--") === 0 && typeof v[k] === "string") el.style.setProperty(k, v[k]); });
  var f = ctx.styles && ctx.styles.css && ctx.styles.css.fonts;
  if (typeof f === "string" && f) {
    var st = document.getElementById("host-fonts");
    if (!st) { st = document.createElement("style"); st.id = "host-fonts"; document.head.appendChild(st); }
    st.textContent = f;
  }
}
var lastH = 0;
function reportSize() {
  var h = Math.ceil(document.documentElement.getBoundingClientRect().height);
  if (h && h !== lastH) { lastH = h; notify("ui/notifications/size-changed", { width: Math.ceil(window.innerWidth), height: h }); }
}
window.addEventListener("message", function (ev) {
  if (ev.source !== window.parent) return;
  var m = ev.data;
  if (!m || m.jsonrpc !== "2.0") return;
  if (m.method === undefined) { // 回應
    var p = pending[m.id];
    if (!p) return;
    delete pending[m.id];
    if (m.error) p.reject(m.error); else p.resolve(m.result);
    return;
  }
  switch (m.method) {
    case "ui/notifications/tool-input": toolArgs = (m.params && m.params.arguments) || {}; break;
    case "ui/notifications/tool-result": onResult(m.params); setTimeout(reportSize, 0); break;
    case "ui/notifications/host-context-changed": applyCtx(m.params); setTimeout(reportSize, 0); break;
    case "ui/resource-teardown": if (m.id !== undefined) post({ id: m.id, result: {} }); break;
    default: // 其他通知忽略;不認得的請求回「沒有這個方法」
      if (m.id !== undefined) post({ id: m.id, error: { code: -32601, message: "Method not found" } });
  }
});
function dataOf(r) {
  if (r && r.structuredContent) return r.structuredContent;
  var t = r && r.content && r.content.filter(function (c) { return c.type === "text"; })[0];
  if (!t) return null;
  try { return JSON.parse(t.text); } catch (e) { return null; }
}
function errText(r) {
  var e = r && r.structuredContent && r.structuredContent.error; // {code, message, status}
  if (e && e.message) return e.message;
  var t = r && r.content && r.content.filter(function (c) { return c.type === "text"; })[0];
  return (t && t.text) || "發生錯誤";
}
function start(name, handler) {
  onResult = function (r) {
    if (r && r.isError) { root.innerHTML = ""; var d = document.createElement("div"); d.className = "err"; d.textContent = errText(r); root.appendChild(d); return; }
    handler(dataOf(r));
    reportSize();
  };
  if (typeof ResizeObserver === "function") new ResizeObserver(reportSize).observe(document.documentElement);
  request("ui/initialize", { appInfo: { name: name, version: "0.1.0" }, appCapabilities: {}, protocolVersion: "2026-01-26" })
    .then(function (res) { applyCtx(res && res.hostContext); hostCaps = (res && res.hostCapabilities) || {}; hostInfo = (res && res.hostInfo) || null; notify("ui/notifications/initialized", {}); reportSize(); })
    .catch(function () { root.textContent = "（無法連上宿主）"; });
}
/* COMMON-JS-END */
// ---- decisions:顯示 issue_decisions 回傳的待決定 / 需要協助;宿主允許時可重新整理、回覆 decision(help 只顯示)----
// 這個畫面只會呼叫下面兩個工具;權限一律由 server 判斷(唯讀授權會被擋,見 isReadOnlyError),畫面不自行放寬。
var TOOL_LIST = "issue_decisions", TOOL_ANSWER = "issue_decision_answer";
var READONLY_MSG = "This connection is read-only; grant read-write to answer";
var NO_TOOLS_MSG = "此宿主不允許從畫面呼叫工具,請改在對話中處理";
var ui = { data: null, refreshing: false, busy: false, readOnly: false, noToolCalls: false, error: "", confirm: null };
var STATUS = { open: "待處理", decided: "已處理", withdrawn: "已撤回" };
var KINDS = [["decision", "待決定"], ["help", "需要協助"]];
var CLIP = 140;
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function str(v) { return typeof v === "string" ? v : typeof v === "number" ? String(v) : ""; }
function actor(a, fallback) {
  if (a && typeof a === "object") return str(a.name) || str(a.handle) || str(fallback);
  return str(fallback);
}
function when(v) {
  var s = str(v);
  if (!s) return "";
  var t = Date.parse(s);
  if (isNaN(t)) return s;
  var diff = Math.round((Date.now() - t) / 60000);
  if (diff >= 0 && diff < 60) return diff <= 1 ? "剛剛" : diff + " 分鐘前";
  if (diff >= 60 && diff < 1440) return Math.floor(diff / 60) + " 小時前";
  if (diff >= 1440 && diff < 43200) return Math.floor(diff / 1440) + " 天前";
  return s.slice(0, 10);
}
// 長文字:超過 CLIP 字先收合,附「展開 / 收合」
function longText(text, cls) {
  var wrap = el("div", cls || "");
  var p = el("div", "txt", text);
  wrap.appendChild(p);
  if (text.length > CLIP || text.split("\n").length > 3) {
    p.className += " clip";
    var b = el("button", "btn", "展開");
    b.type = "button";
    b.addEventListener("click", function () {
      var c = p.className.indexOf("clip") >= 0;
      p.className = c ? "txt" : "txt clip";
      b.textContent = c ? "收合" : "展開";
      setTimeout(reportSize, 0);
    });
    wrap.appendChild(b);
  }
  return wrap;
}
function answerText(d) {
  var a = str(d.answer);
  if (!a) return "";
  var opt = Array.isArray(d.options) ? d.options.filter(function (o) { return o && o.id === a; })[0] : null;
  var label = a === "done" ? "已完成" : a === "declined" ? "婉拒" : a === "other" ? "其他" : opt && str(opt.label) ? opt.label : a;
  var parts = [label];
  if (str(d.answerNote)) parts.push(d.answerNote);
  if (str(d.evidence)) parts.push("證據:" + d.evidence);
  return parts.join(" — ");
}
// 宿主是否允許 View 發起工具呼叫。我們無法得知各宿主實際宣告什麼(有的宿主沒宣告 serverTools 卻允許),
// 所以預設允許,只有宿主明講 serverTools:false、或實際呼叫被宿主拒絕(ui.noToolCalls)才退回唯讀。所有按鈕都只看這一處
function canCallTools() { return hostCaps.serverTools !== false && !ui.noToolCalls; }
function canAnswer(d) { return canCallTools() && d.kind === "decision" && d.status === "open"; }
// 宿主層級的「不支援」:JSON-RPC 錯誤碼(方法不存在、請求無效)或訊息;工具自己的 isError 結果不算(那是 server 的錯,照常顯示)
var UNSUPPORTED_CODES = [-32601, -32600, -32602];
var UNSUPPORTED_RE = /not (supported|allowed)|unsupported|denied|forbidden|method not found/i;
function isHostRefusal(e) {
  return !!e && !e.isError && (UNSUPPORTED_CODES.indexOf(e.code) >= 0 || UNSUPPORTED_RE.test(e.message || ""));
}
function callTool(name, args) {
  return request("tools/call", { name: name, arguments: args })
    .then(function (r) { if (r && r.isError) throw r; return r; })
    .catch(function (e) { if (isHostRefusal(e)) ui.noToolCalls = true; throw e; });
}
// 失敗可能是宿主的 JSON-RPC 錯誤({message})或工具的 isError 結果({structuredContent.error})
function failText(e) { return e && e.isError ? errText(e) : (e && e.message) || "發生錯誤"; }
function isReadOnlyError(e) {
  var x = e && e.structuredContent && e.structuredContent.error;
  return !!x && x.status === 403 && /read-only/i.test(x.message || "");
}
function answerArgs(id, answer, note) {
  var a = { id: id, answer: answer };
  if (toolArgs && toolArgs.org) a.org = toolArgs.org;
  if (note) a.note = note;
  return a;
}
function refresh() {
  ui.refreshing = true; ui.error = ""; draw();
  callTool(TOOL_LIST, toolArgs || {}) // 沒收到 tool-input 時參數未知,照樣試;失敗會顯示 server 的錯誤說明
    .then(function (r) { ui.data = dataOf(r); ui.confirm = null; ui.readOnly = false; })
    .catch(function (e) { ui.error = failText(e); })
    .then(function () { ui.refreshing = false; draw(); });
}
// 回覆成功:把那一筆換成 server 回傳的已處理版本(不自動重抓,畫面上先看得到結果;要更新清單按重新整理)
// 要寫回真正的資料:decisionList 回傳的是過濾後的副本,改它不會影響 ui.data
function markDecided(updated) {
  var raw = decisionRaw(ui.data);
  if (!updated || !raw) return;
  var i = raw.map(function (x) { return x && x.id; }).indexOf(updated.id);
  if (i < 0) return;
  if (Array.isArray(ui.data.decisions)) ui.data.decisions[i] = updated; else ui.data = updated;
}
function submitAnswer() {
  var c = ui.confirm;
  var note = c.note.value.trim();
  c.text = note; // 重畫(出錯、忙碌)時保留已輸入的說明
  if (c.answer === "other" && !note) { ui.error = "選「其他」要填說明"; draw(); return; }
  ui.busy = true; ui.error = ""; draw();
  callTool(TOOL_ANSWER, answerArgs(c.id, c.answer, note))
    .then(function (r) { markDecided(dataOf(r)); ui.confirm = null; })
    .catch(function (e) { if (isReadOnlyError(e)) { ui.readOnly = true; ui.confirm = null; } else ui.error = failText(e); })
    .then(function () { ui.busy = false; draw(); });
}
function confirmBox(d) {
  var c = ui.confirm;
  var box = el("div", "confirm");
  box.appendChild(el("div", "", "確認回覆 " + d.id + ":" + c.label + "?"));
  c.note = el("textarea");
  c.note.rows = 2;
  c.note.value = c.text || "";
  c.note.placeholder = c.answer === "other" ? "說明(必填)" : "備註(選填)";
  box.appendChild(c.note);
  var ok = el("button", "act", "確認送出"), no = el("button", "act", "取消");
  ok.type = no.type = "button";
  ok.disabled = no.disabled = ui.busy;
  ok.addEventListener("click", submitAnswer);
  no.addEventListener("click", function () { ui.confirm = null; draw(); });
  var acts = el("div", "acts");
  acts.appendChild(ok); acts.appendChild(no);
  box.appendChild(acts);
  return box;
}
function answerButton(d, id, label, rec) {
  var b = el("button", "act" + (rec ? " rec" : ""), label + (rec ? "(建議)" : ""));
  b.type = "button";
  b.disabled = ui.busy || ui.readOnly;
  b.addEventListener("click", function () { ui.error = ""; ui.confirm = { id: d.id, answer: id, label: label }; draw(); });
  return b;
}
function answerBar(d) {
  if (ui.confirm && ui.confirm.id === d.id) return confirmBox(d);
  var acts = el("div", "acts");
  (Array.isArray(d.options) ? d.options : []).forEach(function (o) {
    if (o && str(o.id)) acts.appendChild(answerButton(d, o.id, str(o.label) || o.id, o.recommended));
  });
  acts.appendChild(answerButton(d, "other", "其他…", false));
  return acts;
}
function row(d) {
  var r = el("div", "row");
  var main = el("div", "main");
  var st = str(d.status);
  var t = el("div", "t");
  t.appendChild(el("b", "", str(d.id) || "DEC-?"));
  t.appendChild(document.createTextNode(" " + (str(d.title) || "(沒有標題)")));
  main.appendChild(t);
  var meta = el("div", "meta");
  if (st) meta.appendChild(el("span", "chip s-" + st.replace(/[^a-z]/g, ""), STATUS[st] || st));
  if (str(d.sourceIssue)) meta.appendChild(el("span", "chip", "來源 " + d.sourceIssue));
  var by = actor(d.createdByActor, d.createdBy);
  var at = when(d.createdAt);
  if (by || at) meta.appendChild(el("span", "", (by ? by + " 提出" : "提出") + (at ? " · " + at : "")));
  main.appendChild(meta);
  if (str(d.body)) main.appendChild(longText(d.body, "ans"));
  if (Array.isArray(d.options) && d.options.length) {
    var ol = el("ol", "opts");
    d.options.forEach(function (o) {
      if (o == null) return;
      var li = el("li", o.recommended ? "rec" : "");
      var label = typeof o === "string" ? o : str(o.label) || str(o.id);
      li.appendChild(document.createTextNode(label + (o.recommended ? "(建議)" : "")));
      if (o && str(o.description)) li.appendChild(el("span", "d", " — " + o.description));
      ol.appendChild(li);
    });
    main.appendChild(ol);
  }
  var ans = answerText(d);
  if (ans) {
    var a = el("div", "ans");
    a.appendChild(el("b", "", "回覆:"));
    a.appendChild(document.createTextNode(ans));
    var dby = actor(d.decidedByActor, d.decidedBy), dat = when(d.decidedAt);
    if (dby || dat) a.appendChild(el("span", "d", "(" + [dby, dat].filter(Boolean).join(" · ") + ")"));
    main.appendChild(a);
  }
  if (canAnswer(d)) main.appendChild(answerBar(d));
  r.appendChild(main);
  return r;
}
// 資料可能是 {decisions:[…]}(清單)或單一 decision 物件;這裡是唯一判斷形狀的地方
function decisionRaw(d) {
  return d && Array.isArray(d.decisions) ? d.decisions : d && typeof d.id === "string" ? [d] : null;
}
function decisionList(d) {
  var list = decisionRaw(d);
  return list && list.filter(function (x) { return x && typeof x === "object"; });
}
function headBar(text) {
  var bar = el("div", "bar");
  bar.appendChild(el("div", "head", text));
  if (canCallTools()) { // 重新整理要用原本的參數(org、篩選)重打 issue_decisions
    var b = el("button", "act", ui.refreshing ? "更新中…" : "重新整理");
    b.type = "button";
    b.disabled = ui.refreshing || ui.busy;
    b.addEventListener("click", refresh);
    bar.appendChild(b);
  }
  return bar;
}
function statusLines() {
  if (!canCallTools()) { root.appendChild(el("div", "warn", NO_TOOLS_MSG)); return; } // 宿主拒絕時,那次失敗的錯誤文字不必再顯示
  if (ui.readOnly) root.appendChild(el("div", "warn", READONLY_MSG));
  if (ui.error) root.appendChild(el("div", "warn err", ui.error));
}
// 診斷用的一行:宿主實際回報了什麼(宿主能力不可預知,出問題時從這行就看得出來)
function hostLine() {
  var name = hostInfo && str(hostInfo.name), ver = hostInfo && str(hostInfo.version);
  var tools = hostCaps.serverTools === undefined ? "unknown" : hostCaps.serverTools ? "yes" : "no";
  return el("div", "warn", "host: " + (name ? name + (ver ? " " + ver : "") : "unknown") + " · tools: " + tools + " · args: " + (toolArgs !== null ? "yes" : "no"));
}
function draw() {
  root.innerHTML = "";
  drawBody();
  root.appendChild(hostLine());
  reportSize();
}
function drawBody() {
  var d = ui.data, list = decisionList(d);
  if (!list) { root.textContent = "（沒有資料）"; return; }
  var pend = list.filter(function (x) { return x.status === "open"; }).length;
  var total = typeof d.total === "number" ? d.total : list.length;
  root.appendChild(headBar("待處理 " + pend + " 筆" + (total !== list.length ? "(共 " + total + " 筆,顯示 " + list.length + ")" : "")));
  statusLines();
  if (!list.length) { root.appendChild(el("div", "warn", "目前沒有待處理的項目")); return; }
  KINDS.concat([["", "其他"]]).forEach(function (k) {
    var rows = list.filter(function (x) { var kk = x.kind === "decision" || x.kind === "help" ? x.kind : ""; return kk === k[0]; });
    if (!rows.length) return;
    root.appendChild(el("div", "sec", k[1] + "(" + rows.length + ")"));
    rows.forEach(function (x) { root.appendChild(row(x)); });
  });
}
start("omixor-decisions", function (d) { ui.data = d; ui.error = ""; ui.confirm = null; ui.readOnly = false; draw(); });
})();
</script></body></html>
