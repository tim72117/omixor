# omixor iOS 版(第一版:配對登入、對話、Issue、派發)。用 xcodegen 產生 Xcode 專案:
#   cd ios && xcodegen generate
#   xcodebuild -scheme Omixor -destination 'platform=iOS Simulator,name=iPhone 17 Pro' build test
name: Omixor
options:
  bundleIdPrefix: com.tim72117.omixor
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hant
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # 只在模擬器跑,不需要 Apple 帳號;真機簽章之後再設
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  Omixor:
    type: application
    platform: iOS
    sources:
      - path: Omixor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tim72117.omixor.ios
        PRODUCT_NAME: Omixor
        INFOPLIST_FILE: Omixor/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SWIFT_STRICT_CONCURRENCY: minimal
    info:
      path: Omixor/Info.plist
      properties:
        CFBundleDisplayName: omixor
        CFBundleDevelopmentRegion: zh-Hant
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: 用相機掃描 Mac 版 omixor 顯示的配對 QR code。
        # 配對連結 omixor://pair?server=…&code=…
        CFBundleURLTypes:
          - CFBundleURLName: com.tim72117.omixor.ios.pair
            CFBundleURLSchemes:
              - omixor
        # 本機雲端版(http://127.0.0.1:8080)與區網 server 可以用 http(IP 位址與 .local 不受 ATS 限制);其他一律 https
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  OmixorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OmixorTests
    dependencies:
      - target: Omixor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tim72117.omixor.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Omixor.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Omixor
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Omixor:
    build:
      targets:
        Omixor: all
        OmixorTests: [test]
    test:
      targets:
        - OmixorTests
      gatherCoverageData: false
