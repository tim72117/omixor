# 測試:push 與 pull_request 都跑,不部署。
# go:模組(core、server、console)矩陣。每格:go build/vet/test ./...,再用 -tags omixor_minimal 跑一次同樣的組合
#     (確認選用模組拔得乾淨);server 另外交叉編譯 Windows 版的 omixor-local。
#     web 的畫面(console/ui/dist)不進版控;console 這格會先 npm ci && npm run build 再編 Go(go:embed all:dist 需要 dist 有檔案)。
# web-ui:console/ui 前端做型別檢查(tsc --noEmit),不 build;npm test 跑跨語言契約測試(console/ui/contract,讀 core/model/testdata/contract)。
# apple:macOS App(mac/,SwiftPM)swift build && swift test;App 測試要連真的 omixor-local(見 mac/Tests/OmixorTests/TestCore.swift),
#     先編好放進 OMIXOR_LOCAL_BIN;最小版(-tags omixor_minimal)由測試自己用 go build 編,所以這個 job 也要裝 Go。
#     iOS(ios/,xcodegen 從 project.yml 產生專案,專案檔不進版控)只編模擬器版(build-for-testing,測試也編)、不簽章,不跑模擬器。
# PostgreSQL:測試統一走 PostgreSQL(不再有記憶體版 store)。每格(core、server、console)都開一個 postgres service(版本同 console/docker-compose.yml、
#     console/scripts/test-pg.sh 的 postgres:17.2-alpine),設 OMIXOR_TEST_DATABASE_URL;core/storetest 的輔助會用這個帳號(superuser,有 CREATEDB)
#     為每個測試建獨立的 database(從建好結構的範本複製)。沒設的機器(本機)會自己下載並啟動 embedded PostgreSQL,不需要 Docker。
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [core, server, console]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    services:
      postgres:
        image: postgres:17.2-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: omixor_test
          # 平行的測試套件各開連線池,預設 max_connections=100 會逼近上限(postgres 官方映像把這個傳給 initdb)
          POSTGRES_INITDB_ARGS: "-c max_connections=300"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d omixor_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      OMIXOR_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/omixor_test?sslmode=disable
      # 沒有可用的 PostgreSQL 時測試要失敗,不可以略過後顯示通過
      OMIXOR_TEST_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          # repo 根目錄沒有 go.sum;server、console 用 replace 引用 ../core,所以 core/go.sum 也列進來
          cache-dependency-path: |
            core/go.sum
            ${{ matrix.module }}/go.sum
      # console 的 go:embed all:dist 需要建好的畫面(.keep 不在版控時 dist 為空會編不過),所以先 build 前端
      - uses: actions/setup-node@v6
        if: matrix.module == 'console'
        with:
          # 同 console/Dockerfile 的 node:22
          node-version: 22
          cache: npm
          cache-dependency-path: console/ui/package-lock.json
      - name: console/ui npm ci && npm run build
        if: matrix.module == 'console'
        working-directory: console/ui
        run: |
          npm ci
          npm run build
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go test -race(store;連 PG 跑一致性測試)
        if: matrix.module == 'core'
        run: go test -race -count=1 ./store/...
      - name: go build(omixor_minimal)
        run: go build -tags omixor_minimal ./...
      - name: go vet(omixor_minimal)
        run: go vet -tags omixor_minimal ./...
      - name: go test(omixor_minimal)
        run: go test -tags omixor_minimal ./...
      - name: go build omixor-local(windows/amd64)
        if: matrix.module == 'server'
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -o "$RUNNER_TEMP/omixor-local.exe" ./cmd/omixor-local

  web-ui:
    name: console/ui typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console/ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          # 同 console/Dockerfile 的 node:22
          node-version: 22
          cache: npm
          cache-dependency-path: console/ui/package-lock.json
      - name: npm ci
        run: npm ci
      - name: tsc --noEmit
        run: npx tsc --noEmit
      - name: npm test(跨語言契約:core/model/testdata/contract 的範例檔符合前端型別)
        run: npm test

  apple:
    name: macOS app & iOS
    # Xcode 26(Swift 6.2;iOS 的 project.yml 以 Xcode 26 開發)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            core/go.sum
            server/go.sum
      - name: build omixor-local(App 測試用)
        working-directory: server
        run: |
          go build -o "$RUNNER_TEMP/omixor-local" ./cmd/omixor-local
          echo "OMIXOR_LOCAL_BIN=$RUNNER_TEMP/omixor-local" >> "$GITHUB_ENV"
      - name: swift build
        working-directory: mac
        run: swift build
      - name: swift test
        working-directory: mac
        run: swift test
      - name: install xcodegen
        run: brew install xcodegen
      - name: xcodegen generate
        working-directory: ios
        run: xcodegen generate
      - name: xcodebuild build-for-testing(iOS Simulator,不簽章;連測試一起編,含契約測試 ContractTests)
        working-directory: ios
        run: >-
          xcodebuild build-for-testing
          -project Omixor.xcodeproj
          -scheme Omixor
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/ios-dd"
          CODE_SIGNING_ALLOWED=NO
