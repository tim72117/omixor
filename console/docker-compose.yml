# omixor console + PostgreSQL。先複製 .env.example 成 .env 填好密碼與金鑰,再 docker compose up -d --build
#   畫面:http://127.0.0.1:5191   MCP:http://127.0.0.1:5191/mcp(OAuth 登入;要先在 設定 › 認證 啟用 LDAP 或設定 GitLab 登入)
# 連接埠只發布到這台電腦的 127.0.0.1。要給同事用:先在 設定 › 認證 啟用 LDAP,
# 再把 5191 改發布到 0.0.0.0(或放 HTTPS 反向代理)、設 OMIXOR_WEB_HOSTS,MCP 要用的話把 OMIXOR_PUBLIC_URL 設成對外的 https 網址。
# .env 的變數以前叫 OPS_*(OPS_SECRET_KEY、OPS_WEB_HOSTS…),舊的 .env 照樣能用,建議改成 OMIXOR_*。
# 資料庫名稱、使用者與 volume(ops、ops-db)沿用舊名稱:改了會變成一個新的空資料庫。
services:
  db:
    image: postgres:17.2-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ops
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?在 .env 設 POSTGRES_PASSWORD}
    volumes:
      - ops-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d ops"]
      interval: 5s
      retries: 20

  omixor-web:
    # 建置內容是 repo 根目錄:omixor-web 編譯時要引入旁邊的 omixor-core
    build:
      context: ..
      dockerfile: console/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      OMIXOR_DATABASE_URL: postgres://ops:${POSTGRES_PASSWORD}@db:5432/ops?sslmode=disable
      OMIXOR_SECRET_KEY: ${OMIXOR_SECRET_KEY:-${OPS_SECRET_KEY:?在 .env 設 OMIXOR_SECRET_KEY(openssl rand -base64 32)}}
      OMIXOR_WEB_ADDR: 0.0.0.0:5191
      OMIXOR_WEB_LOCAL_ONLY_PUBLISH: "1"
      OMIXOR_WEB_HOSTS: ${OMIXOR_WEB_HOSTS:-${OPS_WEB_HOSTS:-}}
      # LDAP 的管理員帳號名單與 email 網域(有設時蓋掉畫面的值;名單空白就沒有管理員,可用它救援)
      OMIXOR_LDAP_ADMINS: ${OMIXOR_LDAP_ADMINS:-}
      OMIXOR_LDAP_EMAIL_DOMAIN: ${OMIXOR_LDAP_EMAIL_DOMAIN:-}
      # MCP 入口(畫面連接埠的 /mcp,OAuth 授權;見 README)的對外網址。容器裡看到的來源是 Docker 網路位址,
      # 不算「同一台電腦」,所以沒設時預設成發布到本機的網址;要給別台電腦連就設成 https 的對外網址
      OMIXOR_PUBLIC_URL: ${OMIXOR_PUBLIC_URL:-http://127.0.0.1:5191}
      OMIXOR_LDAP_TRUST_MAIL: ${OMIXOR_LDAP_TRUST_MAIL:-}
      # 以下都是選填(空白 = 沒設)。前面的代理層數:放在反向代理後面要設,否則每 IP 的限制會把所有人算成同一個來源
      OMIXOR_TRUSTED_PROXY_HOPS: ${OMIXOR_TRUSTED_PROXY_HOPS:-}
      # MCP 授權頁的登入方式:只用 LDAP 時設 OMIXOR_OAUTH_EVOLEAP_LOGIN=false
      OMIXOR_OAUTH_EVOLEAP_LOGIN: ${OMIXOR_OAUTH_EVOLEAP_LOGIN:-}
      EVOLEAP_URL: ${EVOLEAP_URL:-}
      # 自建 GitLab 登入(設了 OMIXOR_GITLAB_URL 才啟用)。密鑰二擇一:直接放 .env,或掛檔案後給 _FILE
      OMIXOR_GITLAB_URL: ${OMIXOR_GITLAB_URL:-}
      OMIXOR_GITLAB_CLIENT_ID: ${OMIXOR_GITLAB_CLIENT_ID:-}
      OMIXOR_GITLAB_CLIENT_SECRET: ${OMIXOR_GITLAB_CLIENT_SECRET:-}
      OMIXOR_GITLAB_CLIENT_SECRET_FILE: ${OMIXOR_GITLAB_CLIENT_SECRET_FILE:-}
      OMIXOR_GITLAB_CA_CERT: ${OMIXOR_GITLAB_CA_CERT:-}
      OMIXOR_GITLAB_ADMINS: ${OMIXOR_GITLAB_ADMINS:-}
      OMIXOR_GITLAB_EMAIL_DOMAINS: ${OMIXOR_GITLAB_EMAIL_DOMAINS:-}
      OMIXOR_GITLAB_TRUST_MAIL: ${OMIXOR_GITLAB_TRUST_MAIL:-}
    ports:
      - "127.0.0.1:5191:5191"
    volumes:
      # 匯入 macOS App(Swift 版)資料時用:docker compose run --rm omixor-web import /import
      - ${OMIXOR_IMPORT_DIR:-${OPS_IMPORT_DIR:-./.import-empty}}:/import:ro

volumes:
  ops-db:
